<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2dd36f"/>
    </linearGradient>
  </defs>

  <!-- Browser window -->
  <rect x="90" y="80" width="1100" height="560" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Header / traffic lights -->
  <circle cx="130" cy="118" r="6" fill="#ef4444"/>
  <circle cx="154" cy="118" r="6" fill="#f59e0b"/>
  <circle cx="178" cy="118" r="6" fill="#22c55e"/>
  <rect x="200" y="102" width="740" height="32" rx="6" fill="#f8fafc" stroke="#e5e7eb"/>
  <circle cx="216" cy="118" r="3" fill="#94a3b8"/>
  <text x="236" y="122" fill="#94a3b8" font-family="ui-monospace" font-size="13">app.notoAI.com</text>

  <!-- Tab bar -->
  <rect x="200" y="144" width="740" height="40" rx="0 0 0 0" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="200" y="144" width="110" height="40" fill="#eff6ff" stroke="#cbd5e1" stroke-bottom="none"/>
  <text x="255" y="170" fill="#1e40af" font-family="system-ui" font-size="14" font-weight="500" text-anchor="middle">AI 客服</text>
  <rect x="310" y="144" width="110" height="40" fill="#f1f5f9" stroke="#e5e7eb" stroke-bottom="none"/>
  <text x="365" y="170" fill="#374151" font-family="system-ui" font-size="14" font-weight="500" text-anchor="middle">AI 笔记</text>

  <!-- Content area -->
  <rect x="200" y="184" width="740" height="456" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- Left pane: chat interface -->
  <rect x="210" y="200" width="300" height="80" rx="16" fill="#f1f5f9"/>
  <text x="335" y="230" fill="#94a3b8" font-family="system-ui" font-size="12" text-anchor="end">10:22</text>
  <text x="218" y="230" fill="#1e293b" font-family="system-ui" font-size="13" font-weight="500">客户</text>
  <text x="260" y="248" fill="#64748b" font-family="system-ui" font-size="12">订单 XXX 什么时候发货？</text>
  <!-- AI reply bubble -->
  <rect x="210" y="290" width="340" height="76" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="216" y="300" width="20" height="20" rx="10" fill="#bfdbfe"/>
  <text x="240" y="316" fill="#1e293b" font-family="system-ui" font-size="12" font-weight="500">NotoAI AI 客服</text>
  <text x="240" y="334" fill="#475569" font-family="system-ui" font-size="12">您的订单正在打包中，预计 2 天内发出…</text>
  <text x="520" y="360" fill="#94a3b8" font-family="system-ui" font-size="11" text-anchor="end">发送</text>
  <!-- input -->
  <rect x="210" y="378" width="340" height="42" rx="21" fill="#f8fafc" stroke="#e5e7eb"/>
  <rect x="230" y="396" width="280" height="2" fill="#e5e7eb" rx="1"/>
  <circle cx="512" cy="402" r="7" fill="#94a3b8"/>

  <!-- Right pane: note editor -->
  <rect x="530" y="200" width="150" height="340" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="530" y="200" width="150" height="34" rx="8 8 0 0" fill="#f8fafc" stroke="#e5e7eb"/>
  <circle cx="560" y="218" r="5" fill="#94a3b8"/>
  <text x="572" y="222" fill="#64748b" font-family="system-ui" font-size="12">笔记列表</text>
  <rect x="540" y="248" width="130" height="14" rx="2" fill="#cbd5e1"/>
  <rect x="540" y="276" width="120" height="14" rx="2" fill="#e2e8f0"/>
  <rect x="540" y="304" width="130" height="14" rx="2" fill="#cbd5e1"/>
  <rect x="540" y="332" width="110" height="14" rx="2" fill="#e2e8f0"/>
  <rect x="540" y="360" width="130" height="14" rx="2" fill="#cbd5e1"/>

  <!-- Floating AI assist button -->
  <rect x="820" y="570" width="120" height="36" rx="18" fill="#ffffff" stroke="#e5e7eb"/>
  <rect x="840" y="582" width="16" height="12" fill="#3b82f6"/>
  <text x="868" y="594" fill="#1e293b" font-family="system-ui" font-size="12" font-weight="500">AI 助手</text>
</svg>
