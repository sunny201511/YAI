<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2dd36f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)" stroke="none"/>

  <!-- Window 1: AI Customer Service -->
  <rect x="120" y="80" width="460" height="560" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <!-- Title bar -->
  <rect x="120" y="80" width="460" height="56" rx="16 16 0 0" fill="#0f172a"/>
  <circle cx="145" cy="108" r="6" fill="#ef4444"/>
  <circle cx="165" cy="108" r="6" fill="#f59e0b"/>
  <circle cx="185" cy="108" r="6" fill="#22c55e"/>
  <text x="260" y="118" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="500">AI 客服工作台</text>
  <!-- Chat content -->
  <rect x="150" y="160" width="380" height="80" rx="14" fill="#f1f5f9"/>
  <circle cx="165" cy="200" r="18" fill="#cbd5e1"/>
  <rect x="190" y="185" width="100" height="16" rx="3" fill="#94a3b8" opacity="0.4"/>
  <rect x="190" y="205" width="140" height="16" rx="3" fill="#94a3b8" opacity="0.3"/>
  <!-- Input area -->
  <rect x="150" y="490" width="380" height="48" rx="10" fill="#f1f5f9" stroke="#e5e7eb"/>
  <rect x="170" y="514" width="300" height="1" fill="#e5e7eb"/>
  <rect x="490" y="514" width="60" height="24" rx="8" fill="url(#accent)"/>

  <!-- Window 2: AI Notebook -->
  <rect x="660" y="80" width="500" height="560" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="660" y="80" width="500" height="48" rx="16 16 0 0" fill="#0f172a"/>
  <rect x="690" y="112" width="16" height="16" transform="rotate(45 700 112)" fill="#94a3b8"/>
  <rect x="720" y="108" width="100" height="20" rx="4" fill="#cbd5e1"/>
  <rect x="690" y="145" width="470" height="20" rx="4" fill="#94a3b8" opacity="0.2"/>
  <rect x="690" y="175" width="440" height="16" rx="3" fill="#94a3b8" opacity="0.3"/>
  <rect x="690" y="205" width="380" height="16" rx="3" fill="#94a3b8" opacity="0.2"/>
  <rect x="690" y="235" width="400" height="385" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
  <!-- AI assistant block -->
  <rect x="720" y="280" width="340" height="80" rx="12" fill="#f1f5f9" stroke="#e5e7eb"/>
  <rect x="720" y="280" width="340" height="24" rx="12 0 0 0" fill="#0f172a"/>
  <rect x="740" y="310" width="200" height="12" rx="2" fill="#94a3b8" opacity="0.3"/>
  <rect x="740" y="330" width="280" height="12" rx="2" fill="#94a3b8" opacity="0.2"/>
</svg>
