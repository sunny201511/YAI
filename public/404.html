<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <script>
      var path = window.location.pathname + window.location.search + window.location.hash;
      // Persist intended path so the SPA can redirect clientside.
      try { sessionStorage.setItem('spaNavigate', path); } catch (e) {}
      window.location.href = '/';
    </script>
  </body>
</html>
